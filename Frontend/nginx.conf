# Production web server for the React SPA (docker-compose.prod.yml, service "frontend").
# Static files from /usr/share/nginx/html with SPA fallback; /api/ (and /health) proxied to the API container.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Raw JSON telemetry uploads are accepted up to 50 MB by the API (RAW_UPLOAD_MAX_BYTES).
    client_max_body_size 60m;

    location /api/ {
        proxy_pass http://backend:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass http://backend:5080;
        proxy_set_header Host $host;
    }

    # Hashed build assets can be cached for a long time; index.html never.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
