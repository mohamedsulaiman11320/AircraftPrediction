[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "afp_ml"
version = "0.1.0"
description = "ML subsystem of the Aircraft Failure Prediction Platform (dataset audit, anomaly detection, gated failure prediction, scoring worker)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "joblib>=1.4",
    "psycopg[binary]>=3.2",
    "minio>=7.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
afp-ml = "afp_ml.cli:main"

[tool.setuptools.packages.find]
include = ["afp_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"
